name: Keep Chat Agent Awake

# WHAT CHANGED AND WHY: this workflow used to be the ONLY thing that
# triggered an email check — it hit /poll-email on a schedule, and email
# replies only ever went out when this ran. That meant replies could sit
# for up to 3 hours (the old schedule below) unless you manually clicked
# "Run workflow."
#
# chat_agent.py now polls Gmail itself, on its own background timer,
# roughly every EMAIL_POLL_INTERVAL_SECONDS (default 120s — see that env
# var on the Render service). Nothing external needs to trigger a poll
# anymore.
#
# BUT that background loop only runs while the Render process is awake,
# and Render's free tier spins a service down after ~15 minutes with no
# inbound HTTP traffic. So this workflow's job changed: instead of
# triggering a poll, it now just pings "/" every few minutes to keep the
# service from spinning down, so the in-app loop never stops running.
# If you're on a paid Render plan (no spin-down), this workflow becomes
# unnecessary but is harmless to leave running.
#
# /poll-email itself still exists as a manual/debug trigger (still
# protected by POLL_EMAIL_SECRET) — you can still hit it by hand from the
# Actions tab or curl if you want to force an immediate check while
# testing, it's just no longer the only path.

on:
  schedule:
    # Every 10 minutes — comfortably inside Render free tier's ~15 min
    # spin-down window, with margin for GitHub's scheduling jitter (GitHub
    # does not guarantee exact timing on scheduled workflows, especially
    # on frequent schedules). Cron times are UTC.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a ping manually from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping chat agent to keep it awake
        # Hits the deployed chat_agent.py service's health route (Render).
        # RENDER_APP_URL is the base URL of that service, e.g.
        # https://your-service.onrender.com — no trailing slash.
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          # 60s ceiling: this only needs to wake the service up and get a
          # 200 back from "/" — no IMAP poll, no Gemini call happens on
          # this route, so it's fast once the service is warm. The first
          # ping after a spin-down still has to eat Render's free-tier
          # cold-start time (50s+), which is why this isn't set lower.
          curl -s "$RENDER_APP_URL/" \
            --max-time 60 \
            -w "\nHTTP Status: %{http_code}\n"
