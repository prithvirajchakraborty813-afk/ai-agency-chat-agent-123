name: Daily Lead Chain

on:
  schedule:
    # Changed from once/day to hourly — GitHub Actions cron doesn't
    # guarantee exact timing (a few minutes of jitter is normal,
    # especially at the top of the hour when many repos' cron jobs fire
    # at once), but this fires roughly every hour, 24x/day.
    #
    # WHY THIS IS SAFE AT THIS VOLUME: each run re-checks
    # contacted_leads / dedup before spending any Gemini/Vertex AI call,
    # so most of a given hour's "new" leads from gemini_maps_finder.py's
    # fixed city list will already be deduped out — the marginal cost of
    # an extra run is mostly the finder step's own API calls, not
    # wasted qualify/proposal calls on leads you've already contacted.
    # Still worth watching two things as this scales: (1) Vertex AI's
    # per-project-per-minute quota — that's a hard rate limit, not a
    # cost, and running hourly makes hitting it during a burst more
    # likely than daily did; (2) Brevo's free-tier daily send cap
    # (300/day) — sending in smaller hourly batches instead of one
    # daily batch is actually GOOD for deliverability (fewer flagged as
    # bulk/spam), but the daily total still needs to stay under budget.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab too

jobs:
  run-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google ADC credentials
        run: echo "$GOOGLE_ADC_JSON" > "$HOME/adc.json"
        env:
          GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}

      - name: Run daily chain
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/adc.json
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          LEAD_DESCRIPTION: ${{ secrets.LEAD_DESCRIPTION }}
          LEAD_CITIES: ${{ secrets.LEAD_CITIES }}
          COUNT_PER_CITY: ${{ secrets.COUNT_PER_CITY }}
          PRODUCT_NAME: ${{ secrets.PRODUCT_NAME }}
          PRODUCT_PITCH: ${{ secrets.PRODUCT_PITCH }}
          WAHA_BASE_URL: ${{ secrets.WAHA_BASE_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SEND_FROM_EMAIL: ${{ secrets.SEND_FROM_EMAIL }}
        run: python run_daily_chain.py

      # Email polling moved out to its own workflow — see
      # .github/workflows/poll-email.yml. Keeping it here would mean any
      # manual email-loop test also re-runs lead-finding + WhatsApp sends,
      # which is wasteful and, while the WhatsApp number is still
      # recovering from the earlier volume restriction, actively risky.
