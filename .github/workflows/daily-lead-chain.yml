name: Daily Lead Chain

on:
  schedule:
    # Cron times are UTC. IST is UTC+5:30. Example: 20:30 IST = 15:00 UTC.
    # Adjust the line below to your actual fixed time, then convert to UTC.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab too

jobs:
  run-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google ADC credentials
        run: echo "$GOOGLE_ADC_JSON" > "$HOME/adc.json"
        env:
          GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}

      - name: Run daily chain
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/adc.json
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          LEAD_DESCRIPTION: ${{ secrets.LEAD_DESCRIPTION }}
          LEAD_CITIES: ${{ secrets.LEAD_CITIES }}
          COUNT_PER_CITY: ${{ secrets.COUNT_PER_CITY }}
          PRODUCT_NAME: ${{ secrets.PRODUCT_NAME }}
          PRODUCT_PITCH: ${{ secrets.PRODUCT_PITCH }}
          WAHA_BASE_URL: ${{ secrets.WAHA_BASE_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_daily_chain.py

      - name: Poll Gmail for lead replies
        # Hits the deployed chat_agent.py service (Render), not this
        # runner — the polling logic and Gemini conversation engine both
        # live there. RENDER_APP_URL is just the base URL of that service,
        # e.g. https://your-service.onrender.com — no trailing slash.
        # continue-on-error: a broken email poll shouldn't fail the whole
        # daily run or block the lead-gen chain above, which already
        # succeeded by this point.
        continue-on-error: true
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          POLL_EMAIL_SECRET: ${{ secrets.POLL_EMAIL_SECRET }}
        run: |
          curl -sf -X POST "$RENDER_APP_URL/poll-email" \
            -H "X-Poll-Secret: $POLL_EMAIL_SECRET" \
            --max-time 60
